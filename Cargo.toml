[workspace]
resolver = "2"
members = [
    "crates/azusa-cli",
    "crates/azusa-core",
    "crates/azusa-diff",
    "crates/azusa-elci",
    "crates/azusa-fs",
    "crates/azusa-git",
    "crates/azusa-graph",
    "crates/azusa-model",
    "crates/azusa-policy",
    "crates/azusa-store",
]

[workspace.package]
version = "0.1.39"
edition = "2024"
license = "MIT"
authors = ["The azusa Authors"]
repository = "https://github.com/elci-group/azusa"
homepage = "https://github.com/elci-group/azusa"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Numeric domain code: scores are saturating formulas over counts and sizes;
# the possible-truncation/precision lints fight the domain without adding
# safety here (no unsafe, no financial math).
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# Rendering builds strings from many small formatted pieces.
format_push_string = "allow"
# Tests and scoring compare floats for exact equality by design (determinism
# contract); scores are rounded before comparison.
float_cmp = "allow"
# Small Copy enums read fine by reference in match arms.
trivially_copy_pass_by_ref = "allow"
items_after_statements = "allow"
naive_bytecount = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
