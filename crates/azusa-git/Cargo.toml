[package]
name = "azusa-git"
description = "Azusa Git state provider: worktree, index, commit, upstream and remote-branch snapshots via libgit2"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
azusa-model = { path = "../azusa-model" }
azusa-fs = { path = "../azusa-fs" }
git2 = { version = "0.20", default-features = false }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tempfile = { version = "3", optional = true }

[features]
# Exposes `testutil::FixtureRepo` so dependent crates can build test
# repositories in their own test suites.
fixtures = ["dep:tempfile"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
