[package]
name = "azusa-cli"
description = "Azusa CLI — repository drift intelligence: azusa drift | inspect | explain | score | plan | policy | watch | export | matrix"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "azusa"
path = "src/main.rs"

[dependencies]
azusa-core = { path = "../azusa-core" }
azusa-diff = { path = "../azusa-diff" }
azusa-elci = { path = "../azusa-elci" }
azusa-fs = { path = "../azusa-fs" }
azusa-git = { path = "../azusa-git" }
azusa-graph = { path = "../azusa-graph" }
azusa-model = { path = "../azusa-model" }
azusa-policy = { path = "../azusa-policy" }
azusa-store = { path = "../azusa-store" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints]
workspace = true
