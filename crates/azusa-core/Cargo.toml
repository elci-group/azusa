[package]
name = "azusa-core"
description = "Azusa comparison engine: layered state comparison, drift scoring, direction, intent, risk, plans"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
azusa-model = { path = "../azusa-model" }
azusa-diff = { path = "../azusa-diff" }
azusa-graph = { path = "../azusa-graph" }
azusa-policy = { path = "../azusa-policy" }
azusa-git = { path = "../azusa-git" }
azusa-fs = { path = "../azusa-fs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"

[dev-dependencies]
azusa-git = { path = "../azusa-git", features = ["fixtures"] }
tempfile = "3"

[lints]
workspace = true
